services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile

    container_name: worknest_app

    working_dir: /app

    environment:
      SERVER_NAME: ":8000"

    ports:
      - "8000:8000"

    volumes:
      - ./server:/app

    depends_on:
      - postgres

    tty: true

  postgres:
    image: postgres:17

    container_name: worknest_postgres

    environment:
      POSTGRES_DB: worknest
      POSTGRES_USER: worknest
      POSTGRES_PASSWORD: worknest

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
