services:
  postgres:
    image: postgres:17

    container_name: worknest_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: worknest
      POSTGRES_USER: worknest
      POSTGRES_PASSWORD: worknest

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
